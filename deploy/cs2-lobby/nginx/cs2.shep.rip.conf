server {
    include /etc/nginx/conf.d/deny-backups.inc;
    include /etc/nginx/conf.d/security-headers-hsts.inc;
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/ssl/origin/shep.rip.cf.pem;
    ssl_certificate_key /etc/nginx/ssl/origin/shep.rip.cf.key;
    server_name cs2.shep.rip;

    # Only through Cloudflare, like shep.rip.conf, but with the stricter $cs2_from_cf (00-cs2-lobby.conf).
    # The visitor address comes from CF-Connecting-IP, trusted only from Cloudflare's ranges.
    include /etc/nginx/conf.d/shep-cf-realip.inc;
    if ($cs2_from_cf = 0) {
        return 444;
    }

    # The mod fetches https; plain http goes there too.
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/cs2.access.log cs2_anon;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 4k;

    # Docker embedded DNS, looked up per request so recreating the lobby container needs no reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cs2_lobby cs2m-lobby:8080;

    # CS2M server browser: GET /sessions and /health only. The UDP side (relay.shep.rip:4242) bypasses nginx.
    # The lobby sets Cache-Control itself (/sessions "public, max-age=2", /health "no-store"); no add_header here,
    # so there is one Cache-Control header and the server-level HSTS header is kept.
    location ~ ^/(sessions|health)$ {
        limit_except GET { deny all; }
        limit_req zone=cs2_api burst=20 nodelay;
        limit_conn cs2_conn 10;
        proxy_pass http://$cs2_lobby;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
