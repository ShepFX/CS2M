# Included from the http block by nginx.conf's `include /etc/nginx/conf.d/*.conf`, so this is http context.
# Named 00- so everything here is declared before cs2.shep.rip.conf uses it.

# Who may reach cs2.shep.rip: Cloudflare's edge only (ranges as in 00-shep-cloudflare.conf, fetched 19 Oct 2026),
# plus loopback for a curl from inside the nginx container. Unlike $shep_from_cf this does NOT trust the Docker
# ranges: nginx is published on [::]:80/443 through docker-proxy, so every direct IPv6 visitor arrives from a
# Docker gateway address (100.64.10.1 on utilities_iw4m-net) and would pass a check that trusts them.
geo $realip_remote_addr $cs2_from_cf {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
    127.0.0.1/32 1;
}

# Per visitor (the real address, after realip): the in-game browser fetches /sessions when it opens and then
# every so often, so 2 a second with bursts of 20 is far above normal use. 10 connections at once per visitor.
limit_req_zone $binary_remote_addr zone=cs2_api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=cs2_conn:10m;

# The access log for cs2.shep.rip keeps only the /24 (IPv4) or /48 (IPv6) of each visitor, and no query string.
map $remote_addr $cs2_anon_addr {
    "~^(?<cs2_p4>\d+\.\d+\.\d+)\.\d+$" "$cs2_p4.0";
    "~^(?<cs2_p6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "$cs2_p6::";
    default "-";
}
log_format cs2_anon '$cs2_anon_addr [$time_local] "$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent $request_time "$http_user_agent"';
