# Catch-all for requests whose Host or TLS SNI matches no server_name: scanners and anyone hitting the bare IP.
# Without it nginx uses the first server block it read (cs2.shep.rip.conf), so https://37.187.250.23/ answered as
# the lobby and showed the shep.rip origin certificate. Every real site is reached by name, through Cloudflare or
# DNS-only, so none of them depends on being the default.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    # Refuse the TLS handshake outright: no certificate is shown, so the IP can't be tied to a domain
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
